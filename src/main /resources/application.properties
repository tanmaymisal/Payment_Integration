spring.application.name=Stripe_Payment_Integration01
server.port=4041 
#this server port 4041 is used as embedded server for this spring boot application
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/spbootcore?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=tanmay

#JPA Hibernate properties 
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

